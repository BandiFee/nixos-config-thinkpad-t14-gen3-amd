# Noctalia v5 configuration for the ThinkPad T14.
# Runtime changes made in Settings are stored as user overrides.

[accessibility]
ui_scale = 1.0

[shell]
font_family = "JetBrainsMono Nerd Font"
time_format = "{:%H:%M}"
date_format = "%A, %Y-%m-%d"
telemetry_enabled = false
settings_show_advanced = true
clipboard_enabled = true
clipboard_history_max_entries = 200
clipboard_keep_from_closed_apps = false
niri_overview_type_to_launch_enabled = false
polkit_agent = false

[shell.animation]
enabled = true
speed = 1.2

[shell.shadow]
direction = "down"
alpha = 0.45

[shell.panel]
# Glass mode makes the floating launcher and its search field translucent.
transparency_mode = "glass"
borders = true
shadow = true
list_item_background = false
floating_layer = "overlay"
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
clipboard_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[shell.launcher]
categories = true
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
provider_prefix = "/"

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade", "wipe", "zoom"]
transition_duration = 900
edge_smoothness = 0.3

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Catppuccin"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = false

# Render Fcitx5's glass theme whenever Noctalia derives a new palette from the
# wallpaper. Generate both SVG assets before theme.conf, then restart Fcitx5
# once so Classic UI drops its cached colours and images.
[theme.templates.user.fcitx5-theme]
index = 30
input_path = "~/.config/noctalia/templates/fcitx5/theme.conf"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/theme.conf"
post_hook = "systemctl --user restart fcitx5-daemon.service"

[theme.templates.user.fcitx5-panel]
index = 10
input_path = "~/.config/noctalia/templates/fcitx5/panel.svg"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/panel.svg"

[theme.templates.user.fcitx5-highlight]
index = 20
input_path = "~/.config/noctalia/templates/fcitx5/highlight.svg"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/highlight.svg"

# A stationary wallpaper is cheaper and calmer than a second blurred backdrop.
[backdrop]
enabled = false

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
background_opacity = 0.96
offset_x = 12
offset_y = 8

[osd]
enabled = true
position = "bottom_center"
position_vertical = "bottom_center"
orientation = "horizontal"
background_opacity = 0.94
offset_x = 16
offset_y = 16

[lockscreen]
enabled = true
fingerprint = true
blurred_desktop = false
blur_intensity = 0.4
tint_intensity = 0.35
lock_before_suspend = true

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false
minimum_brightness = 0.05

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[bar.main]
position = "top"
thickness = 36
background_opacity = 0.0
radius = 12
margin_ends = 12
margin_edge = 8
padding = 12
widget_spacing = 6
shadow = false
auto_hide = false
reserve_space = true
capsule = true
capsule_fill = "surface_variant"
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.62
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.96
panel_overlap = 12
start = ["workspaces"]
center = ["clock"]
end = ["media", "tray", "battery", "network", "control-center"]

[dock]
enabled = false

[desktop_widgets]
enabled = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "session"

[widget.clock]
format = "{:%a %d %b %H:%M}"
tooltip_format = "{:%A, %Y-%m-%d}"
font_weight = 700

[widget.network]
vpn_status = "both"
show_label = false
show_vpn_label = false

[widget.notifications]
hide_when_no_unread = false
