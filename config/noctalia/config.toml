# Noctalia v5 configuration for the ThinkPad T14.
# Runtime changes made in Settings are stored as user overrides.

[accessibility]
ui_scale = 1.0

[shell]
font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%A, %Y-%m-%d"
telemetry_enabled = false
settings_show_advanced = true
clipboard_enabled = true
clipboard_history_max_entries = 200
clipboard_keep_from_closed_apps = false
niri_overview_type_to_launch_enabled = false
polkit_agent = false

[shell.animation]
enabled = true
speed = 1.2

[shell.shadow]
direction = "down"
alpha = 0.45

[shell.panel]
# Glass mode makes the floating launcher and its search field translucent.
transparency_mode = "glass"
borders = true
shadow = true
list_item_background = false
floating_layer = "overlay"
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
clipboard_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

# Keep the full session panel useful while exposing the reference lock screen's
# suspend, reboot and shutdown controls inside the login card. Noctalia omits
# the already-active lock action from the lock screen automatically.
[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "suspend"
variant = "outline"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
variant = "outline"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "5"

[shell.launcher]
categories = true
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
provider_prefix = "/"

# Open the video wallpaper picker from the launcher's `/` provider overview.
[shell.launcher.dmenu.entry.video-wallpaper]
command = "noctalia msg panel-open noctalia/mpvpaper:picker >/dev/null"
label = "Video Wallpaper"
prefix = "video"
glyph = "movie"
global = false

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade", "wipe", "zoom"]
transition_duration = 900
edge_smoothness = 0.3

# The official video-wallpaper plugin integrates mpvpaper with Noctalia's
# wallpaper surface, picker, persistence and wallpaper-derived theme colors.
[plugins]
enabled = ["noctalia/mpvpaper"]
auto_update = "official"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Videos/Wallpapers"
picker_placement = "floating"
picker_position = "center"
mute = true
hardware_decode = true
auto_pause = true
extract_last_frame = true

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Catppuccin"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = false

# Render Fcitx5's glass theme whenever Noctalia derives a new palette from the
# wallpaper. Generate both SVG assets before theme.conf, then restart Fcitx5
# once so Classic UI drops its cached colours and images.
[theme.templates.user.fcitx5-theme]
index = 30
input_path = "~/.config/noctalia/templates/fcitx5/theme.conf"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/theme.conf"
post_hook = "systemctl --user restart fcitx5-daemon.service"

[theme.templates.user.fcitx5-panel]
index = 10
input_path = "~/.config/noctalia/templates/fcitx5/panel.svg"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/panel.svg"

[theme.templates.user.fcitx5-highlight]
index = 20
input_path = "~/.config/noctalia/templates/fcitx5/highlight.svg"
output_path = "~/.local/share/fcitx5/themes/noctalia-glass/highlight.svg"

# A stationary wallpaper is cheaper and calmer than a second blurred backdrop.
[backdrop]
enabled = false

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
background_opacity = 0.96
offset_x = 12
offset_y = 8

[osd]
enabled = true
position = "bottom_center"
position_vertical = "bottom_center"
orientation = "horizontal"
background_opacity = 0.94
offset_x = 16
offset_y = 16

[osd.kinds]
media = false

[lockscreen]
enabled = true
fingerprint = true
blurred_desktop = false
blur_intensity = 0.10
tint_intensity = 0.08
lock_before_suspend = true

# A wallpaper-aware lock screen inspired by the reference layout. Each output
# gets its own coordinates because the laptop panel and external display use
# different logical resolutions.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "welcome-edp",
  "time-edp",
  "date-edp",
  "lockscreen-login-box@eDP-1",
  "welcome-hdmi",
  "time-hdmi",
  "date-hdmi",
  "lockscreen-login-box@HDMI-A-1",
]

[lockscreen_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[lockscreen_widgets.widget.welcome-edp]
type = "label"
output = "eDP-1"
cx = 768.0
cy = 150.0
placement_width = 1536.0
placement_height = 960.0
box_width = 520.0
box_height = 64.0

[lockscreen_widgets.widget.welcome-edp.settings]
title = "Welcome, BandiFee"
description = ""
color = "#00000099"
opacity = 1.0
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget.time-edp]
type = "clock"
output = "eDP-1"
cx = 768.0
cy = 272.0
placement_width = 1536.0
placement_height = 960.0
box_width = 360.0
box_height = 112.0

[lockscreen_widgets.widget.time-edp.settings]
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "#000000ad"
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget.date-edp]
type = "clock"
output = "eDP-1"
cx = 768.0
cy = 365.0
placement_width = 1536.0
placement_height = 960.0
box_width = 520.0
box_height = 34.0

[lockscreen_widgets.widget.date-edp.settings]
clock_style = "digital"
format = "{:%A, %d %B}"
center_text = true
color = "#00000080"
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 768.0
cy = 650.0
placement_width = 1536.0
placement_height = 960.0
box_width = 720.0
box_height = 148.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "regular"
background_color = "surface"
background_opacity = 0.36
background_radius = 20.0
input_opacity = 0.42
input_radius = 14.0
center_password_text = false
show_login_button = true
show_caps_lock = true
show_keyboard_layout = true
show_unlock_hint = true
show_session_buttons = true
show_media = false
show_weather = false

[lockscreen_widgets.widget.welcome-hdmi]
type = "label"
output = "HDMI-A-1"
cx = 960.0
cy = 170.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 600.0
box_height = 70.0

[lockscreen_widgets.widget.welcome-hdmi.settings]
title = "Welcome, BandiFee"
description = ""
color = "#00000099"
opacity = 1.0
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget.time-hdmi]
type = "clock"
output = "HDMI-A-1"
cx = 960.0
cy = 304.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 400.0
box_height = 120.0

[lockscreen_widgets.widget.time-hdmi.settings]
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "#000000ad"
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget.date-hdmi]
type = "clock"
output = "HDMI-A-1"
cx = 960.0
cy = 405.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 600.0
box_height = 38.0

[lockscreen_widgets.widget.date-hdmi.settings]
clock_style = "digital"
format = "{:%A, %d %B}"
center_text = true
color = "#00000080"
font_family = "Inter"
shadow = false
background = false

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
type = "login_box"
output = "HDMI-A-1"
cx = 960.0
cy = 735.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 780.0
box_height = 148.0

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
layout = "regular"
background_color = "surface"
background_opacity = 0.36
background_radius = 20.0
input_opacity = 0.42
input_radius = 14.0
center_password_text = false
show_login_button = true
show_caps_lock = true
show_keyboard_layout = true
show_unlock_hint = true
show_session_buttons = true
show_media = false
show_weather = false

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false
minimum_brightness = 0.05

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[bar.main]
position = "top"
thickness = 36
background_opacity = 0.0
radius = 12
margin_ends = 12
margin_edge = 8
padding = 12
widget_spacing = 6
shadow = false
auto_hide = false
reserve_space = true
capsule = true
capsule_fill = "surface_variant"
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.62
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.96
panel_overlap = 12
start = ["workspaces"]
center = ["clock"]
end = ["media", "tray", "battery", "network", "control-center"]

[dock]
enabled = false

[desktop_widgets]
enabled = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "session"

[widget.clock]
format = "{:%a %d %b %H:%M}"
tooltip_format = "{:%A, %Y-%m-%d}"
font_weight = 700

[widget.media]
max_length = 800
title_scroll = "always"

[widget.network]
vpn_status = "both"
show_label = false
show_vpn_label = false

[widget.notifications]
hide_when_no_unread = false
