patch:
  # Preserve the raw input code (for example, "nihao") when switching modes.
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: commit_code
    Eisu_toggle: clear
  # A new input context always begins in Chinese mode.
  switches/@0/reset: 0
